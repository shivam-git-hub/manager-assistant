<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harry — Executive Project Tracker</title>
    
    <!-- CDNs: Tailwind, Vue 3, Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    
    <!-- Custom Theme Styling -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/components.css">
    
    <style>
        /* Custom overrides if any */
        [v-cloak] { display: none; }
    </style>
</head>
<body>
    <div id="app" v-cloak class="app-layout font-sans">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="space-y-8">
                <!-- Branding -->
                <div class="px-2">
                    <h1 class="text-xl font-bold tracking-tight font-serif flex items-center gap-2" style="color: var(--accent);">
                        <span>Harry</span>
                        <span class="text-xs uppercase px-1.5 py-0.5 bg-emerald-100 text-emerald-800 rounded font-sans tracking-widest font-bold">PM</span>
                    </h1>
                    <p class="text-[10px] text-muted uppercase tracking-wider font-semibold mt-1">Manager Assistant Console</p>
                </div>
                
                <!-- Nav group -->
                <nav class="nav-group">
                    <a href="#/portfolio" class="nav-link" :class="{ 'active': currentRoute.view === 'portfolio' || currentRoute.view === 'project' }">
                        <span class="text-sm">📁</span>
                        <span>Portfolio Overview</span>
                    </a>
                    
                    <a href="#/conflicts" class="nav-link" :class="{ 'active': currentRoute.view === 'conflicts' }">
                        <span class="text-sm">🚨</span>
                        <span>Conflicts Log</span>
                        <span v-if="openConflictsCount > 0" class="ml-auto bg-red-100 text-red-800 font-mono text-[10px] font-bold px-1.5 py-0.5 rounded">
                            {{ openConflictsCount }}
                        </span>
                    </a>
                    
                    <a href="#/workload" class="nav-link" :class="{ 'active': currentRoute.view === 'workload' }">
                        <span class="text-sm">📊</span>
                        <span>Team Workload</span>
                    </a>
                    
                    <a href="#/briefs" class="nav-link" :class="{ 'active': currentRoute.view === 'briefs' }">
                        <span class="text-sm">📰</span>
                        <span>Morning Briefs</span>
                    </a>
                    
                    <a href="#/meetings" class="nav-link" :class="{ 'active': currentRoute.view === 'meetings' || currentRoute.view === 'meeting_detail' }">
                        <span class="text-sm">📅</span>
                        <span>Calendar agenda</span>
                    </a>
                </nav>
            </div>
            
            <!-- Bottom Anchor -->
            <div class="px-2 text-[10px] text-muted border-t border-slate-100 pt-3">
                <div class="font-bold">Account: Shivam</div>
                <div class="mt-0.5">Role: General Manager</div>
            </div>
        </aside>
        
        <!-- Main Panel -->
        <main class="main-content">
            <!-- Topbar status -->
            <header class="top-bar">
                <div class="flex items-center gap-3">
                    <span class="text-xs uppercase tracking-widest font-mono text-slate-400 font-semibold">Active Portal:</span>
                    <span class="font-serif text-sm font-bold text-slate-800 capitalize">{{ currentRoute.view }} Page</span>
                </div>
                
                <!-- Clock -->
                <div class="flex items-center gap-4 bg-slate-50 border-parchment rounded px-3 py-1.5 text-xs font-mono font-medium text-slate-600">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Sim Time:</span>
                    <span class="text-slate-800">{{ formattedClock }}</span>
                </div>
            </header>
            
            <!-- Content View Wrapper -->
            <div class="content-body">
                <!-- Portfolio View -->
                <portfolio-view 
                    v-if="currentRoute.view === 'portfolio'" 
                    :portfolio-data="portfolioData"
                ></portfolio-view>
                
                <!-- Project Detail View -->
                <project-view 
                    v-if="currentRoute.view === 'project'" 
                    :slug="currentRoute.slug"
                ></project-view>
                
                <!-- Conflicts View -->
                <conflicts-view 
                    v-if="currentRoute.view === 'conflicts'"
                ></conflicts-view>
                
                <!-- Workload View -->
                <workload-view 
                    v-if="currentRoute.view === 'workload'"
                ></workload-view>
                
                <!-- Briefs View -->
                <briefs-view 
                    v-if="currentRoute.view === 'briefs'"
                ></briefs-view>
                
                <!-- Meetings Calendar View -->
                <meetings-view 
                    v-if="currentRoute.view === 'meetings'"
                    :clock-state="clockState"
                ></meetings-view>
                
                <!-- Meeting Detail View -->
                <meeting-detail-view 
                    v-if="currentRoute.view === 'meeting_detail'"
                    :id="currentRoute.id"
                ></meeting-detail-view>
            </div>
        </main>
        
        <!-- Global Conversational Assistant Chat Dock -->
        <chat-dock></chat-dock>
        
    </div>

    <!-- Orchestration App loader -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
